<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFFERWALL | Premium Crypto Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.8);
            --primary: #50b687;
            --secondary: #6366f1;
            --accent: #f59e0b;
            --dark: #0f172a;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            color: var(--dark);
            min-height: 100vh;
        }

        /* Navbar المحسن */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 10%;
            background: var(--glass);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.3);
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .logo-box img { width: 45px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
        .logo-box span { font-size: 24px; font-weight: 900; color: var(--primary); letter-spacing: -1px; }

        .nav-links a {
            text-decoration: none;
            color: #64748b;
            font-weight: 600;
            margin: 0 15px;
            transition: 0.3s;
            font-size: 14px;
        }

        .nav-links a:hover { color: var(--secondary); }

        .btn-top-login { background: #6366f1; color: white; border: none; padding: 10px 25px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-top-reg { background: var(--accent); color: white; border: none; padding: 10px 25px; border-radius: 12px; font-weight: 600; cursor: pointer; margin-left: 10px; transition: 0.3s; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); }
        .btn-top-reg:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4); }

        /* Hero Section */
        .hero { padding: 80px 20px; text-align: center; }
        .hero h1 { font-size: 70px; margin: 0; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
        .hero p { color: #64748b; font-size: 20px; max-width: 600px; margin: 20px auto; line-height: 1.6; }

        /* Crypto Floating Icons */
        .crypto-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 40px 0;
            flex-wrap: wrap;
        }

        .coin-card {
            background: white;
            padding: 10px;
            border-radius: 50%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transition: 0.4s;
            animation: float 3s ease-in-out infinite;
        }
        .coin-card:hover { transform: scale(1.2) rotate(15deg); }
        .coin-card img { width: 45px; height: 45px; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Wallets - النسخة الاحترافية */
        .wallet-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.03);
            transition: 0.3s;
            border: 1px solid rgba(0,0,0,0.02);
            position: relative;
            overflow: hidden;
        }
        .card:hover { transform: translateY(-10px); box-shadow: 0 30px 60px rgba(0,0,0,0.08); }

        .card-icon { font-size: 40px; margin-bottom: 15px; }
        .card h3 { margin: 10px 0; font-size: 22px; }
        
        .fpay { background: var(--dark); color: white; }
        .cwal { background: #ffffff; border: 2px solid #6366f1; }
        .pyer { background: linear-gradient(45deg, #222, #444); color: white; }

        /* Login Area */
        .login-wrap {
            max-width: 400px;
            margin: 60px auto;
            background: var(--glass);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1);
        }

        .google-btn {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            border: 1px solid #e2e8f0;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .google-btn:hover { background: #f8fafc; border-color: #cbd5e1; }

        .divider { margin: 25px 0; color: #94a3b8; font-weight: bold; position: relative; }
        
        .auth-grid { display: flex; gap: 15px; }
        .auth-grid button {
            flex: 1;
            padding: 15px;
            border-radius: 15px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-l { background: var(--secondary); color: white; }
        .btn-r { background: var(--accent); color: white; }

    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo-box">
            <img src="https://cryptologos.cc/logos/baby-doge-coin-babydoge-logo.png" alt="Logo">
            <span>OFFERWALL</span>
        </div>
        <div class="nav-links">
            <a href="#">ADVERTISE</a>
            <a href="#">FANPAGE</a>
            <a href="#">SUPPORT</a>
        </div>
        <div>
            <button class="btn-top-login">Login</button>
            <button class="btn-top-reg">Register</button>
        </div>
    </nav>

    <section class="hero">
        <h1>Earn Crypto Easily</h1>
        <p>Join the highest paying offerwall platform. Complete simple tasks and get paid instantly to your favorite wallets.</p>
        
        <div class="crypto-grid">
            <div class="coin-card"><img src="https://cryptologos.cc/logos/bitcoin-btc-logo.png"></div>
            <div class="coin-card" style="animation-delay: 0.2s"><img src="https://cryptologos.cc/logos/ethereum-eth-logo.png"></div>
            <div class="coin-card" style="animation-delay: 0.4s"><img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png"></div>
            <div class="coin-card" style="animation-delay: 0.6s"><img src="https://cryptologos.cc/logos/pepe-pepe-logo.png"></div>
            <div class="coin-card" style="animation-delay: 0.8s"><img src="https://cryptologos.cc/logos/solana-sol-logo.png"></div>
            <div class="coin-card" style="animation-delay: 1s"><img src="https://cryptologos.cc/logos/tether-usdt-logo.png"></div>
        </div>
    </section>

    <div class="wallet-section">
        <div class="card">
            <div class="card-icon">🏦</div>
            <h3>Direct</h3>
            <p style="color:#64748b">Instant Bank/Wallet</p>
        </div>
        <div class="card fpay">
            <div class="card-icon" style="color:#00a6ff">♦</div>
            <h3>FaucetPay</h3>
            <p style="color:#94a3b8">Micro-payment Wallet</p>
        </div>
        <div class="card cwal">
            <div class="card-icon"><img src="https://cwallet.com/favicon.ico" width="40"></div>
            <h3>Cwallet</h3>
            <p style="color:#64748b">Simple & Secure</p>
        </div>
        <div class="card pyer">
            <div class="card-icon">P</div>
            <h3>PAYEER</h3>
            <p style="color:#ccc">Global System</p>
        </div>
    </div>

    <div class="login-wrap">
        <button class="google-btn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="22">
            Continue with Google
        </button>
        <div class="divider">OR</div>
        <div class="auth-grid">
            <button class="btn-l">Login</button>
            <button class="btn-r">Register</button>
        </div>
    </div>

</body>
</html>
